<script type="text/plain" id="__jsx">
const FK=["冒頭の結論","見出し構造","箇条書き・表","FAQ/Q&A","統計・出典","鮮度(日付)","定義文"];
const FSHORT=["結論","見出し","箇条書き","FAQ","出典","鮮度","定義"];
const FMAX=[15,15,15,15,20,10,10];
const TIP=["記事冒頭に3行の結論(TL;DR)を置く","見出しを疑問形(「〜とは?」)にし階層化","箇条書き・比較表を追加","FAQ/Q&Aセクションを設ける","統計・数値＋出典を明記(最重要)","公開日/更新日を明記","「XとはYである」定義文を入れる"];
const SUMMARY=["結論","要約","まとめ","tl;dr","summary","この記事では","ポイントは","結論から","本記事は","概要"];
const QWORD=["とは","なぜ","どうやって","方法","？","?","how","what","why","違い","メリット","手順","選び方"];
const QA=["q.","q:","faq","よくある質問","q&a","よくあるご質問"];
const SRCWORD=["出典","参照元","引用元","参考文献","によると","調査によれば","source:","出所"];
const NUM=/\d+(\.\d+)?\s*(%|％|円|人|件|倍|位|万人|億円|kg|km|ポイント)/g;
// 鮮度: 画像URL等の誤検出を防ぐため「日付を表す文脈」を必須にする
const DATE=/(公開日|更新日|最終更新|投稿日|published|updated|last\s*modified)[\s:：]*.{0,20}?20\d{2}|20\d{2}年\s*\d{1,2}\s*月\s*\d{1,2}\s*日/i;
// 定義文: 「〜とは」〜「である/です/を指す」の距離を広げ、実際の定義に届くようにする
const DEF=/[^\n。]{2,40}(とは|というのは)[^。]{2,200}?(です|である|を指す|のこと|を意味)/;
const has=(t,a)=>a.some(w=>t.toLowerCase().includes(w));
// リンクだけの行・ナビゲーション行を本文から除外する（誤スコアの主原因）
const isNavLine=s=>{
  if(!s)return true;
  const stripped=s.replace(/\[[^\]]*\]\([^)]*\)/g,"").replace(/!\[[^\]]*\]\([^)]*\)/g,"").replace(/[#*\-|>\s]/g,"");

  return stripped.length<12;

function parse(input){
  input=(input||"").trim();
  // r.jina.ai が付ける前置き(Title:/URL Source:/Markdown Content:)を除去して本文だけにする
  const mc=input.indexOf("Markdown Content:");

    // ★実HTMLを解析する（見出しの階層を本物のh1/h2/h3から取得できる）
    const doc=new DOMParser().parseFromString(body,"text/html");
    const tEl=doc.querySelector("title"); title=tEl?tEl.textContent.trim():"";
    // 公開日/更新日は meta と time タグから正確に取得する
    const meta=doc.querySelector('meta[property="article:published_time"],meta[property="article:modified_time"],meta[name="pubdate"],meta[itemprop="datePublished"]');
    if(meta)dateMeta=meta.getAttribute("content")||"";
    const tm=doc.querySelector("time[datetime]"); if(!dateMeta&&tm)dateMeta=tm.getAttribute("datetime")||"";
    doc.querySelectorAll("script,style,nav,header,footer,aside,noscript").forEach(e=>e.remove());
    // 本文領域があればそこに限定（ナビ由来の誤検出を避ける）
    const main=doc.querySelector("main,article,[role=main]")||doc.body||doc;
    ["h1","h2","h3"].forEach((t,li)=>main.querySelectorAll(t).forEach(e=>{
      const x=e.textContent.trim(); if(x&&x.length<=120){h.push(x);hLevels[li+1]=(hLevels[li+1]||0)+1;}}));
    lists=[...main.querySelectorAll("ul,ol")].filter(u=>u.querySelectorAll("li").length>=2).length;
    tables=main.querySelectorAll("table").length; links=main.querySelectorAll("a").length;
    text=main.textContent||"";
    const ps=[...main.querySelectorAll("p")].map(e=>e.textContent.trim()).filter(x=>x.length>=40);
    first=ps[0]||text.trim().slice(0,300);
  }else{
    text=body;
    body.split(/\n/).forEach(l=>{const s=l.trim();
      const hm=s.match(/^(#{1,6})\s+(.*)$/);
      if(hm){
        const title=hm[2].replace(/\[[^\]]*\]\([^)]*\)/g,"").replace(/!\[[^\]]*\]\([^)]*\)/g,"").trim();
        // 見出しは「短く・リンクの塊でない」ものだけを本物として数える
        if(title.length>=2&&title.length<=60){h.push(title);const lv=hm[1].length;hLevels[lv]=(hLevels[lv]||0)+1;}
      }
      if(/^([-*・]|\d+\.)\s/.test(s)&&!isNavLine(s))lists++;
      if(/^\|.*\|/.test(s))tables++;});
    links=(body.match(/https?:\/\//g)||[]).length;
    // 冒頭 = 見出し・リンク行を除いた最初の実質的な段落
    first=body.split(/\n/).map(x=>x.trim())
      .find(x=>x.length>=40&&!/^#{1,6}\s/.test(x)&&!isNavLine(x))||"";
    const tm=input.match(/^Title:\s*(.+)$/m); if(tm)title=tm[1].trim();
    const pm=input.match(/^Published Time:\s*(.+)$/m); if(pm)dateMeta=pm[1].trim();
  }
  return {text,h,lists,tables,links,first,hLevels,title,dateMeta};
}
function score(input){
  const p=parse(input); const t=p.text; const raw=[];
  // ① 冒頭の結論: 長さだけで満点にしない。結論を示す語があるか／適切な要約長かで段階評価
  let s0=0;
  if(p.first.length>=40){s0+=5;}
  if(has(p.first,SUMMARY))s0+=7;
  if(p.first.length>=60&&p.first.length<=400)s0+=3;
  raw.push(Math.min(s0,15));
  // ② 見出し構造: 「数」ではなく「階層があるか」「疑問形か」を見る
  let hs=0;
  const lv=Object.keys(p.hLevels).length;
  if(p.h.length>=3)hs+=4;
  if(lv>=2)hs+=5;            // h2とh3など複数階層がある＝構造化されている
  if(lv>=3)hs+=2;
  const qh=p.h.filter(x=>has(x,QWORD)).length;
  if(qh>=1)hs+=2; if(qh>=3)hs+=2;
  raw.push(Math.min(hs,15));
  // ③ 箇条書き・表: 4行で満点は甘すぎるので基準を引き上げる
  raw.push(Math.min(Math.min(p.lists,10)*1.5+Math.min(p.tables,2)*3,15));
  // ④ FAQ: 見出しにFAQがある方が強い
  const faqInH=p.h.some(x=>has(x,QA));
  raw.push(faqInH?15:(has(t,QA)?9:2));
  // ⑤ 統計・出典: 数値と「出典表記」を分けて評価（リンク数では出典と認めない）
  const nums=(t.match(NUM)||[]).length;
  const srcWord=has(t,SRCWORD);
  raw.push(Math.min(Math.min(nums,6)*2+(srcWord?8:0),20));
  // ⑥ 鮮度: meta/timeタグの日付を最優先。無ければ本文の日付文脈（画像URLは弾く）
  raw.push(p.dateMeta?10:(DATE.test(t)?8:2));

  raw.push(DEF.test(t)?10:3);

  return {f,total:f.reduce((a,b)=>a+b.s,0),title:p.title,dateMeta:p.dateMeta,textLen:(t||"").trim().length};
}
async function fetchPage(url){
  let u=url.trim(); if(!u)return null;
  if(!/^https?:\/\//i.test(u))u="https://"+u;
  // ★実HTMLで取得する（Markdown変換だと見出し階層が失われ、サイトごとに結果がぶれるため）
  const r=await fetch("https://r.jina.ai/"+u,{headers:{"x-return-format":"html"}});
  if(!r.ok)throw new Error("取得失敗(HTTP "+r.status+")");
  const txt=await r.text();
  // r.jina.ai は取得先が404でもHTTP200を返すため、内容側でエラーを検知する
  if(/Warning:\s*Target URL returned error\s*(\d+)/i.test(txt)){
    const m=txt.match(/Warning:\s*Target URL returned error\s*(\d+)/i);
    throw new Error("ページが存在しません(取得先が "+m[1]+" を返しました)");
  }
  const tm=txt.match(/<title[^>]*>([\s\S]{0,200}?)<\/title>/i);
  const ttl=tm?tm[1].trim():"";
  if(/404|not\s*found|ページが見つかり|お探しのページ/i.test(ttl)){
    throw new Error("ページが存在しない可能性があります（タイトル:「"+ttl.slice(0,40)+"」）");
  }
  if(txt.trim().length<400)throw new Error("内容がほとんど取得できませんでした（JavaScript描画のみのページの可能性）");

}
const color=v=>v>=70?"#17a673":v>=50?"#f0a500":"#e0533b";
function level(t){return t>=80?["優秀","#0f7a54"]:t>=60?["良好","#17a673"]:t>=40?["標準","#f0a500"]:["要改善","#e0533b"];}

// 7軸レーダーチャート(自社＋競合オーバーレイ)
function Radar({own,comp}){
  const cx=150,cy=140,R=100,N=7;
  const ang=i=>-Math.PI/2+i*2*Math.PI/N;
  const pt=(i,ratio)=>[cx+Math.cos(ang(i))*R*ratio, cy+Math.sin(ang(i))*R*ratio];
  const poly=arr=>arr.map((v,i)=>pt(i,v.s/v.max).join(",")).join(" ");

    {[0.33,0.66,1].map((rr,k)=>(<polygon key={k} points={FK.map((_,i)=>pt(i,rr).join(",")).join(" ")} fill="none" stroke="#e3e8ee"/>))}

    {comp && <polygon points={poly(comp.f)} fill="#8aa9d633" stroke="#8aa9d6" strokeWidth="2"/>}

  </svg>);
}


// ===== 自動保存 & データ書き出し/読み込み（入力内容がリロードで消えないようにする） =====
const STORE="geo_v1";
function usePersist(name,initial){
  const [v,setV]=React.useState(function(){
    try{var s=localStorage.getItem(STORE+":"+name);return s?JSON.parse(s):initial;}catch(e){return initial;}
  });
  React.useEffect(function(){
    try{localStorage.setItem(STORE+":"+name,JSON.stringify(v));}catch(e){}
  },[name,v]);
  return [v,setV];
}
function collectAll(){
  var o={};
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if(k&&k.indexOf(STORE+":")===0){try{o[k.slice(STORE.length+1)]=JSON.parse(localStorage.getItem(k));}catch(e){}}
  }
  return o;
}
function DataBar(){
  const [msg,setMsg]=React.useState("");
  const fileRef=React.useRef(null);
  const save=function(){
    try{
      var data={_tool:STORE,_savedAt:new Date().toISOString(),data:collectAll()};
      var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
      var a=document.createElement("a");
      a.href=URL.createObjectURL(blob);
      a.download=STORE+"_"+new Date().toISOString().slice(0,10)+".json";
      a.click();URL.revokeObjectURL(a.href);
      setMsg("書き出しました");setTimeout(function(){setMsg("");},2500);
    }catch(e){setMsg("書き出しに失敗しました");}
  };
  const load=function(e){
    var f=e.target.files&&e.target.files[0]; if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var j=JSON.parse(rd.result);
        if(!j||!j.data)throw new Error("形式が違います");
        if(j._tool&&j._tool!==STORE){ if(!confirm("別のツールのファイルのようです。読み込みますか？"))return; }
        Object.keys(j.data).forEach(function(k){localStorage.setItem(STORE+":"+k,JSON.stringify(j.data[k]));});
        location.reload();
      }catch(err){setMsg("読み込めませんでした（"+err.message+"）");}
    };
    rd.readAsText(f);
  };
  const clear=function(){
    if(!confirm("入力した内容をすべて消して、最初の状態に戻します。よろしいですか？"))return;
    var del=[];
    for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf(STORE+":")===0)del.push(k);}
    del.forEach(function(k){localStorage.removeItem(k);});
    location.reload();
  };
  return (<div style={{background:"#f2f7f4",border:"1px solid #cfe3d8",borderRadius:10,padding:"9px 12px",
      margin:"0 0 12px",fontSize:13,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",color:"#0f5c3f"}}>
    <span>💾 <b>入力した内容はこの端末に自動保存されます</b>（閉じても消えません）</span>
    <span style={{flex:1}}></span>
    <button onClick={save} style={{border:0,borderRadius:7,background:"#17a673",color:"#fff",padding:"6px 11px",cursor:"pointer",fontSize:12.5}}>データを書き出す</button>
    <button onClick={function(){fileRef.current&&fileRef.current.click();}} style={{border:0,borderRadius:7,background:"#e7f0eb",color:"#0f5c3f",padding:"6px 11px",cursor:"pointer",fontSize:12.5}}>読み込む</button>
    <button onClick={clear} style={{border:0,borderRadius:7,background:"#f7e4e4",color:"#c0392b",padding:"6px 11px",cursor:"pointer",fontSize:12.5}}>最初に戻す</button>
    <input ref={fileRef} type="file" accept="application/json" onChange={load} style={{display:"none"}}/>
    {msg && <span style={{color:"#0f5c3f",fontWeight:"bold"}}>{msg}</span>}
  </div>);
}

function App(){
  const [sites,setSites]=usePersist("sites",[
    {name:"自社", url:"", r:null},{name:"競合A", url:"", r:null},
  ]);
  const [busy,setBusy]=React.useState(false); const [err,setErr]=React.useState("");
  const upd=(i,k,v)=>setSites(s=>s.map((x,j)=>j===i?{...x,[k]:v}:x));

    setBusy(true);setErr("");
    try{
      const out=await Promise.all(sites.map(async s=>{
        if(!s.url.trim())return {...s,r:null};
        try{const txt=await fetchPage(s.url);return {...s,r:score(txt)};}
        catch(e){return {...s,r:null,error:e.message};}

  return (<div className="wrap"><DataBar/>
    <h1>GEO診断ツール <span className="sub">URLを入れるだけで、生成AIに引用されやすい構造かを実解析</span></h1>

      <div className="real">🔗 <b>自社と競合のURLを入力</b>して「解析する」を押すと、実ページを取得して構造をスコア化・比較します。</div>
      <div style={{background:"#fff4e0",border:"1px solid #f0d98a",borderRadius:10,padding:"10px 12px",fontSize:12.5,color:"#8a6100",lineHeight:1.8,margin:"8px 0"}}>
        <b>🔒 ご利用前に必ずお読みください（重要）</b><br/>
        入力されたURLは、ページ取得のため<b>外部サービス「r.jina.ai」(Jina AI社) に送信されます</b>。
        当社サーバーには送信されませんが、第三者のサーバーを経由します。<br/>
        <b>公開されていないURL（社内サイト・ステージング環境・会員限定ページ・URLに認証情報を含むもの）は入力しないでください。</b>
        公開済みのページのみでご利用ください。
      </div>
      {sites.map((s,i)=>(<div className="site" key={i}>
        <input className="nm" value={s.name} onChange={e=>upd(i,"name",e.target.value)}/>
        <input className="url" placeholder={i===0?"https://自社ページのURL":"https://競合ページのURL（任意）"} value={s.url} onChange={e=>upd(i,"url",e.target.value)}/>
        {s.error && <div className="err">⚠ {s.name}: {s.error}</div>}
      </div>))}
      <button className="primary" disabled={busy} onClick={analyze}>{busy?"解析中…（数秒）":"解析する"}</button>
      <button className="ghost" onClick={()=>{upd(0,"url","https://digitalidentity.co.jp/");upd(1,"url","https://www.cyberagent.co.jp/");}}>例のURLを入れる</button>
      {err && <div className="err" style={{marginTop:8}}>{err}</div>}
    </div>

    {own && (own.textLen<1500 || own.f[1].s<=4) && <div className="card">
      <div style={{background:"#fff4e0",border:"1px solid #f0d98a",borderRadius:10,padding:12,fontSize:13,color:"#8a6100",lineHeight:1.8}}>
        <b>⚠ このページは本文をうまく取得できませんでした（取得できた本文 {own.textLen.toLocaleString()}文字／見出し検出 {own.f[1].s}点）</b><br/>
        JavaScriptで内容を描画するサイトの可能性があります。この場合スコアは低く出ますが、
        <b>生成AIのクローラも同じくJavaScriptを実行しないことが多い</b>ため、「AIから見えていない」という診断自体は妥当なことがあります。
        正確に測るには、サーバー側で本文を出力する（SSR/静的化）対応をご検討ください。
      </div>
    </div>}

    {own && <div className="card" style={{display:"flex",gap:20,flexWrap:"wrap",alignItems:"center",justifyContent:"space-between"}}>
      <div style={{textAlign:"center"}}>
        <h2>{sites[0].name} の総合GEOスコア</h2>
        {own.title && <div className="sub" style={{marginBottom:4}}>解析したページ: 「{own.title.slice(0,50)}」</div>}
        <div style={{fontSize:44,fontWeight:"bold",color:color(own.total)}}>{own.total}<span style={{fontSize:16,color:"#8a97a6"}}> /100</span></div>
        <span className="lvl" style={{background:lvlc}}>水準: {lvl}</span>
        {comp && <div style={{marginTop:8,fontSize:14}}>競合「{sites[1].name}」({comp.total}点)より <b className={overall>=0?"up":"down"}>{overall>=0?"+"+overall+"点 上":overall+"点 下"}</b></div>}
      </div>
      <div><Radar own={own} comp={comp}/><div className="sub" style={{textAlign:"center"}}>■自社 {comp?"／ ■競合":""}（外周=満点）</div></div>
    </div>}

    {own && <div className="card"><h2>因子別スコア{comp?"（自社 vs 競合）":""}</h2>
      {own.f.map((f,i)=>{const cv=comp?comp.f[i].s:null;const d=cv!=null?f.s-cv:null;
        return (<div className="barrow" key={i}>
          <span className="name">{f.k}</span>
          <div className="track"><div className="fill" style={{width:(f.s/f.max*100)+"%",background:color(f.s/f.max*100)}}></div></div>
          <span className="val">{f.s}/{f.max}</span>
          {cv!=null && <span style={{width:96,fontSize:12}} className={d>=0?"up":"down"}>{d>=0?"▲":"▼"}競合{cv} ({d>=0?"+"+d:d})</span>}
        </div>);})}
    </div>}

    {own && <div className="card"><h2>🤖 分析と競合を超えるプラン</h2>
      <div className="ai">
        {comp
          ? (overall>=0
              ? <span>自社は競合「{sites[1].name}」に総合 <b>+{overall}点で上回って</b>います。さらに突き放すには下記「上乗せ」を。</span>
              : <span>自社は競合「{sites[1].name}」に総合 <b>{Math.abs(overall)}点 負けて</b>います。逆転には、負けている <b>{losing.length}因子</b>を競合水準に上げると <b>+{losing.reduce((a,x)=>a+x.gap,0)}点</b>で逆転可能です。</span>)
          : <span>競合URLも入れると「どこで勝ち/負けか」と逆転プランを表示します。</span>}
      </div>

      {losing.length>0 && <div className="plan">
        <div className="tierlabel">① まず競合を超える（負けている因子を競合水準へ）</div>
        <ul>{losing.map((x,k)=>(<li key={k}><b>{x.k}</b>：自社{x.own} → 競合{x.comp}（<span className="up">+{x.gap}点</span>）<br/><span className="sub">具体策: {x.tip}</span></li>))}</ul>
      </div>}

      {headroom.length>0 && <div className="plan">
        <div className="tierlabel">② さらに引き離す（満点までの伸びしろ）</div>
        <ul>{headroom.slice(0,4).map((x,k)=>(<li key={k}><b>{x.k}</b>：{x.own}/{x.max}（あと<span className="up">+{x.room}点</span>）— {x.tip}</li>))}</ul>
      </div>}
      {comp && losing.length===0 && <p className="sub">全因子で競合以上です。②の伸びしろを埋めて満点(100)を目指しましょう。</p>}
    </div>}

    <p className="note">※実ページ取得は r.jina.ai 経由の簡易解析（本文抽出のため一部の表/装飾は簡略化）。構造スコアは実測、因子重みは当社ヒューリスティック。実際のAI引用可否はPoCで検証してください。</p>
  </div>);
}

function ActionBar(){
  const [msg,setMsg]=React.useState("");
  // 画面の内容をテキストとして取り出し、Excel等に貼れる形でコピーする
  const copyAll=function(){
    try{
      var root=document.getElementById("root");
      var out=[];
      root.querySelectorAll("h1,h2,h3,table,.metric,.verdict,.todo li,.chk").forEach(function(el){
        if(el.tagName==="TABLE"){
          el.querySelectorAll("tr").forEach(function(tr){
            var cells=[];
            tr.querySelectorAll("th,td").forEach(function(td){
              var inp=td.querySelector("input,select");
              cells.push(((inp?inp.value:td.textContent)||"").trim().replace(/\s+/g," "));
            });
            if(cells.join("").trim())out.push(cells.join("\t"));
          });
          out.push("");
        }else{
          var t=(el.textContent||"").trim().replace(/\s+/g," ");
          if(t)out.push(t);
        }
      });
      var text=out.join("\n");
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){setMsg("コピーしました（Excelやメールに貼れます）");},function(){fallback(text);});
      }else fallback(text);
      function fallback(t){
        var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();
        try{document.execCommand("copy");setMsg("コピーしました");}catch(e){setMsg("コピーできませんでした");}
        document.body.removeChild(ta);
      }
      setTimeout(function(){setMsg("");},3000);
    }catch(e){setMsg("コピーできませんでした");}
  };
  return (<div className="noprint" style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",margin:"0 0 12px"}}>
    <button onClick={function(){window.print();}}
      style={{border:0,borderRadius:8,background:"#334155",color:"#fff",padding:"8px 14px",cursor:"pointer",fontSize:13}}>
      🖨 印刷 / PDFで保存</button>
    <button onClick={copyAll}
      style={{border:0,borderRadius:8,background:"#e2e8f0",color:"#334155",padding:"8px 14px",cursor:"pointer",fontSize:13}}>
      📋 結果をコピー（Excelに貼れます）</button>
    {msg && <span style={{fontSize:12.5,color:"#0f5c3f",fontWeight:"bold"}}>{msg}</span>}
  </div>);
}

    <div><b style={{color:"#556"}}>提供</b>：株式会社デジタルアイデンティティ</div>

// ===== サーバー保管・複数人共有 =====
const API="https://di-tools-api.vercel.app/api/workspace";
function qs(k){try{return new URLSearchParams(location.search).get(k)||"";}catch(e){return "";}}
function ShareBar(){
  const [busy,setBusy]=React.useState(false);
  const [msg,setMsg]=React.useState("");
  const [info,setInfo]=React.useState(function(){
    try{var s=localStorage.getItem(STORE+":__share");return s?JSON.parse(s):null;}catch(e){return null;}
  });
  const [who,setWho]=React.useState(function(){
    try{return localStorage.getItem("di_who")||"";}catch(e){return "";}
  });
  const [loaded,setLoaded]=React.useState(null);
  const [title,setTitle]=React.useState("");

  // 共有リンクで開かれた場合はサーバーから読み込む
  React.useEffect(function(){
    var id=qs("ws"); if(!id)return;
    var key=qs("key");
    setBusy(true);
    fetch(API+"?id="+encodeURIComponent(id))
      .then(function(r){return r.json();})
      .then(function(j){
        if(j.error){setMsg("読み込めませんでした: "+j.error);setBusy(false);return;}
        Object.keys(j.data||{}).forEach(function(k){
          localStorage.setItem(STORE+":"+k,JSON.stringify(j.data[k]));
        });
        if(key)localStorage.setItem(STORE+":__share",JSON.stringify({id:id,editKey:key}));
        setLoaded({title:j.title,updatedBy:j.updatedBy,updatedAt:j.updatedAt,canEdit:!!key});
        // 取り込んだ内容を反映するため再読込（?ws= は外す）
        if(!sessionStorage.getItem("di_loaded_"+id)){
          sessionStorage.setItem("di_loaded_"+id,"1");
          location.replace(location.pathname);
        }
        setBusy(false);
      })
      .catch(function(){setMsg("サーバーに接続できませんでした");setBusy(false);});
  },[]);

  const remember=function(v){setWho(v);try{localStorage.setItem("di_who",v);}catch(e){}};
  const body=function(){
    return {tool:STORE, title:title||document.title, who:who,
      data:(typeof collectAll==="function"?collectAll():{})};
  };
  const create=function(){
    setBusy(true);setMsg("");
    fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body())})
      .then(function(r){return r.json();})
      .then(function(j){
        if(j.error){setMsg(j.error);setBusy(false);return;}
        var nx={id:j.id,editKey:j.editKey};
        localStorage.setItem(STORE+":__share",JSON.stringify(nx));
        setInfo(nx);setMsg("サーバーに保存しました");setBusy(false);
      }).catch(function(){setMsg("サーバーに接続できませんでした");setBusy(false);});
  };
  const update=function(){
    if(!info)return create();
    setBusy(true);setMsg("");
    fetch(API+"?id="+info.id+"&key="+info.editKey,{method:"PUT",
      headers:{"Content-Type":"application/json"},body:JSON.stringify(body())})
      .then(function(r){return r.json();})
      .then(function(j){
        if(j.error){setMsg(j.error);setBusy(false);return;}
        setMsg("サーバーに保存しました（"+new Date().toLocaleTimeString("ja-JP")+"）");setBusy(false);
      }).catch(function(){setMsg("サーバーに接続できませんでした");setBusy(false);});
  };
  const linkView=info?(location.origin+location.pathname+"?ws="+info.id):"";
  const linkEdit=info?(linkView+"&key="+info.editKey):"";
  const copy=function(t,label){
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){setMsg(label+"をコピーしました");
        setTimeout(function(){setMsg("");},3000);});
    }else{
      var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();
      try{document.execCommand("copy");setMsg(label+"をコピーしました");}catch(e){}
      document.body.removeChild(ta);
    }
  };
  const bs={border:0,borderRadius:7,padding:"7px 12px",cursor:"pointer",fontSize:12.5};
  return (<div className="noprint" style={{background:"#eef4fb",border:"1px solid #c5d8f5",borderRadius:10,
      padding:"10px 12px",margin:"0 0 12px",fontSize:13,color:"#1a4d8f"}}>
    <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
      <span>☁️ <b>サーバーに保存して、チームで共有できます</b></span>
      <span style={{flex:1}}></span>
      <input value={who} onChange={function(e){remember(e.target.value);}} placeholder="お名前（任意）"
        style={{border:"1px solid #b9cbe4",borderRadius:6,padding:"6px 8px",fontSize:12.5,width:120}}/>
      {!info && <button onClick={create} disabled={busy}
        style={Object.assign({},bs,{background:"#2b6cb0",color:"#fff"})}>{busy?"保存中…":"サーバーに保存"}</button>}
      {info && <button onClick={update} disabled={busy}
        style={Object.assign({},bs,{background:"#2b6cb0",color:"#fff"})}>{busy?"保存中…":"変更を保存"}</button>}
    </div>
    {loaded && <div style={{marginTop:8,background:"#fff",borderRadius:8,padding:"8px 10px"}}>
      📥 共有リンクから読み込みました{loaded.updatedBy?"（最終更新: "+loaded.updatedBy+"）":""}。
      {loaded.canEdit?"このリンクは編集できます。":"このリンクは閲覧専用です（変更しても他の人には反映されません）。"}
    </div>}
    {info && <div style={{marginTop:8,background:"#fff",borderRadius:8,padding:"8px 10px",lineHeight:2}}>
      <div><b>閲覧用リンク</b>（見るだけ）
        <button onClick={function(){copy(linkView,"閲覧用リンク");}} style={Object.assign({},bs,{background:"#e2e8f0",color:"#334155",marginLeft:6})}>コピー</button>
        <div style={{fontSize:11.5,color:"#667",wordBreak:"break-all"}}>{linkView}</div></div>
      <div style={{marginTop:6}}><b>編集用リンク</b>（変更もできる／取扱注意）
        <button onClick={function(){copy(linkEdit,"編集用リンク");}} style={Object.assign({},bs,{background:"#e2e8f0",color:"#334155",marginLeft:6})}>コピー</button>
        <div style={{fontSize:11.5,color:"#667",wordBreak:"break-all"}}>{linkEdit}</div></div>
    </div>}
    {msg && <div style={{marginTop:6,fontWeight:"bold"}}>{msg}</div>}
    <div style={{marginTop:6,fontSize:11.5,color:"#5b7fb0"}}>
      ※「サーバーに保存」を押したときだけ送信されます。押さなければ、これまで通り端末内だけで処理されます。
    </div>
  </div>);
}

</script>
